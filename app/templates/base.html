<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "QR Yoklama Pro" }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <a href="/" class="font-semibold text-lg">QR Yoklama Pro</a>
      <div class="text-sm text-slate-600">
        {% if me %}
          <span class="mr-3">👤 {{ me.username }} ({{ me.role }})</span>
          <a href="/logout" class="underline hover:text-slate-900">Çıkış</a>
        {% endif %}
      </div>
    </div>
    {% if flash %}
      <div class="mb-4 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-amber-900">{{ flash }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
